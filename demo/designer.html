<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tee Designer Prototype | Hifill Design Studio</title>
<meta name="robots" content="noindex">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
  :root { --coral:#ff5c45; --ink:#1c2b4a; --muted:#516077; --line:#c9d3e5; --bg:#f4f7ff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:560px; margin:0 auto; padding:18px 16px 60px; }
  h1 { font-size:22px; margin:6px 0 2px; }
  .tag { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.08em; color:#fff; background:var(--coral); border-radius:999px; padding:3px 10px; margin-bottom:6px; }
  p.sub { color:var(--muted); font-size:14px; margin:0 0 14px; }
  .stage { background:#fff; border:1px solid var(--line); border-radius:16px; padding:10px; box-shadow:0 6px 24px rgba(28,43,74,.08); }
  .canvas-container { width:100% !important; height:auto !important; margin:0 auto; }
  .canvas-container canvas { width:100% !important; height:auto !important; display:block; }
  .view-toggle { display:flex; gap:8px; margin:12px 0 4px; }
  .view-toggle button { flex:1; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:12px; }
  .panel h2 { font-size:14px; margin:0 0 10px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .row:last-child { margin-bottom:0; }
  button, .file-label {
    appearance:none; border:1.5px solid var(--line); background:#fff; color:var(--ink);
    border-radius:12px; padding:12px 14px; font-size:14px; font-weight:600; cursor:pointer;
    min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  button:active, .file-label:active { transform:scale(.97); }
  button.primary, .file-label.primary { background:var(--coral); border-color:var(--coral); color:#fff; flex:1; }
  button.ghost { flex:1; }
  button.small { padding:8px 10px; min-height:40px; font-size:13px; }
  button:disabled { opacity:.4; }
  input[type=text] {
    flex:1; min-width:0; border:1.5px solid var(--line); border-radius:12px; padding:12px;
    font-size:15px; min-height:44px;
  }
  select {
    border:1.5px solid var(--line); border-radius:12px; padding:10px; font-size:14px; min-height:44px; background:#fff;
  }
  input[type=color] { width:52px; height:44px; border:1.5px solid var(--line); border-radius:12px; padding:4px; background:#fff; }
  input[type=file] { display:none; }
  .swatches { display:flex; flex-wrap:wrap; gap:10px; }
  .swatch {
    width:44px; height:44px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0; min-height:0;
  }
  .swatch.active { border-color:var(--coral); box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--coral); }
  .hint { font-size:12.5px; color:var(--muted); margin:10px 0 0; line-height:1.5; }
  .foot { text-align:center; color:var(--muted); font-size:12px; margin-top:26px; }
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">PROTOTYPE v0.1</span>
  <h1>Tee Designer</h1>
  <p class="sub">試玩版 — upload 圖、加字、拉放擺位，睇下手感啱唔啱。</p>

  <div class="stage">
    <canvas id="c" width="600" height="700"></canvas>
  </div>
  <div class="view-toggle">
    <button id="vFront" class="small primary" type="button">Front</button>
    <button id="vBack" class="small" type="button">Back</button>
  </div>

  <div class="panel">
    <h2>1 · Artwork</h2>
    <div class="row">
      <label class="file-label primary" style="flex:1">Upload artwork<input type="file" id="upload" accept="image/*"></label>
    </div>
    <div class="row">
      <input type="text" id="txt" placeholder="輸入文字，例如：Toronto 2026" maxlength="60">
      <button id="addText" type="button">加字</button>
    </div>
    <div class="row">
      <select id="fontSel">
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="Impact">Impact</option>
        <option value="'Courier New'">Courier</option>
        <option value="'Comic Sans MS'">Comic Sans</option>
      </select>
      <input type="color" id="txtColor" value="#1c2b4a" title="文字顏色">
      <button id="applyStyle" class="small" type="button">套用</button>
    </div>
  </div>

  <div class="panel">
    <h2>2 · 衫顏色</h2>
    <div class="swatches" id="swatches"></div>
  </div>

  <div class="panel">
    <h2>3 · 已選圖層</h2>
    <div class="row">
      <button id="dup" class="small" type="button">複製</button>
      <button id="flip" class="small" type="button">左右反轉</button>
      <button id="fwd" class="small" type="button">上移一層</button>
      <button id="bwd" class="small" type="button">下移一層</button>
      <button id="del" class="small" type="button">刪除</button>
    </div>
    <div class="row">
      <button id="toggleGuide" class="small ghost" type="button">隱藏印刷範圍</button>
      <button id="clear" class="small ghost" type="button">清空設計</button>
    </div>
  </div>

  <div class="panel">
    <h2>4 · 完成</h2>
    <div class="row">
      <button id="download" class="primary" type="button">下載預覽圖 (PNG)</button>
    </div>
    <p class="hint">正式版會將高清生產圖直接送去 order，唔使再問客攞圖。</p>
  </div>

  <p class="foot">Hifill Design Studio · designer prototype</p>
</div>

<script>
(function(){
  const PRINT = { x: 218, y: 238, w: 164, h: 224 };
  const canvas = new fabric.Canvas('c', { preserveObjectStacking: true, backgroundColor: '#ffffff' });

  // ---- Tee shapes ----
  const BODY = 'M245 145 C270 168 330 168 355 145 L405 165 L478 232 L432 292 L392 262 L392 580 L208 580 L208 262 L168 292 L122 232 L195 165 Z';
  const COLLAR_F = 'M245 145 C270 168 330 168 355 145';
  const COLLAR_B = 'M250 150 C278 161 322 161 350 150';
  const HEM = 'M208 552 L392 552';

  function teeGroup(collarD){
    const body = new fabric.Path(BODY, { fill:'#ffffff', stroke:'rgba(0,0,0,0.14)', strokeWidth:2 });
    const collar = new fabric.Path(collarD, { fill:'', stroke:'rgba(0,0,0,0.20)', strokeWidth:11, strokeLineCap:'round' });
    const hem = new fabric.Path(HEM, { fill:'', stroke:'rgba(0,0,0,0.08)', strokeWidth:3 });
    const g = new fabric.Group([body, collar, hem], { selectable:false, evented:false });
    g._body = body;
    return g;
  }
  const teeFront = teeGroup(COLLAR_F);
  const teeBack = teeGroup(COLLAR_B);
  teeBack.visible = false;
  canvas.add(teeFront, teeBack);

  // ---- Print-area guide ----
  const guide = new fabric.Rect({
    left: PRINT.x, top: PRINT.y, width: PRINT.w, height: PRINT.h,
    fill: 'rgba(0,0,0,0)', stroke: '#9aa5b8', strokeDashArray: [9,7], strokeWidth: 1.5,
    selectable: false, evented: false
  });
  const guideLabel = new fabric.Text('PRINT AREA', {
    left: PRINT.x + PRINT.w/2, top: PRINT.y - 22, originX: 'center',
    fontSize: 13, fill: '#9aa5b8', fontFamily: 'Arial', selectable: false, evented: false
  });
  canvas.add(guide, guideLabel);

  // ---- Keep designs inside the print area ----
  function clampToPrint(obj){
    obj.setCoords();
    const b = obj.getBoundingRect(true, true);
    let dx = 0, dy = 0;
    if (b.left < PRINT.x) dx = PRINT.x - b.left;
    if (b.top < PRINT.y) dy = PRINT.y - b.top;
    if (b.left + b.width > PRINT.x + PRINT.w) dx = PRINT.x + PRINT.w - (b.left + b.width);
    if (b.top + b.height > PRINT.y + PRINT.h) dy = PRINT.y + PRINT.h - (b.top + b.height);
    if (dx || dy){ obj.left += dx; obj.top += dy; obj.setCoords(); }
  }
  ['object:moving','object:scaling','object:rotating'].forEach(ev =>
    canvas.on(ev, e => { if (e.target && e.target.isDesign) clampToPrint(e.target); })
  );
  function markDesign(o){ o.isDesign = true; return o; }
  function centerInPrint(o){ o.set({ left: PRINT.x + PRINT.w/2, top: PRINT.y + PRINT.h/2, originX:'center', originY:'center' }); }

  // ---- Upload artwork ----
  document.getElementById('upload').addEventListener('change', function(e){
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = function(){
      fabric.Image.fromURL(r.result, function(img){
        const s = Math.min((PRINT.w*0.96)/img.width, (PRINT.h*0.96)/img.height, 1);
        img.scale(s);
        markDesign(img); centerInPrint(img);
        canvas.add(img); canvas.setActiveObject(img);
        clampToPrint(img); canvas.requestRenderAll();
      });
    };
    r.readAsDataURL(f);
    e.target.value = '';
  });

  // ---- Add / style text ----
  document.getElementById('addText').addEventListener('click', function(){
    const v = document.getElementById('txt').value.trim() || 'Your Text';
    const tb = new fabric.Textbox(v, {
      width: 230, fontSize: 44, textAlign: 'center',
      fontFamily: document.getElementById('fontSel').value,
      fill: document.getElementById('txtColor').value
    });
    markDesign(tb); centerInPrint(tb);
    canvas.add(tb); canvas.setActiveObject(tb);
    clampToPrint(tb); canvas.requestRenderAll();
  });
  document.getElementById('applyStyle').addEventListener('click', function(){
    const o = canvas.getActiveObject();
    if (o && o.isDesign && o.type === 'textbox'){
      o.set({ fontFamily: document.getElementById('fontSel').value, fill: document.getElementById('txtColor').value });
      canvas.requestRenderAll();
    }
  });

  // ---- Garment colors ----
  const COLORS = [
    ['白色','#ffffff'],['黑色','#1c1c1e'],['深藍','#1f3a5f'],['寶藍','#2456a6'],
    ['紅色','#c0392b'],['森林綠','#2d6a4f'],['粉紅','#f2a9c4'],['灰色','#9aa0a6']
  ];
  const sw = document.getElementById('swatches');
  COLORS.forEach(function(c, i){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'swatch' + (i===0 ? ' active' : '');
    b.style.background = c[1].trim(); b.title = c[0]; b.setAttribute('aria-label', c[0]);
    b.addEventListener('click', function(){
      const col = c[1].trim();
      teeFront._body.set('fill', col); teeBack._body.set('fill', col);
      sw.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      canvas.requestRenderAll();
    });
    sw.appendChild(b);
  });

  // ---- Front / back ----
  const vF = document.getElementById('vFront'), vB = document.getElementById('vBack');
  function setView(front){
    teeFront.visible = front; teeBack.visible = !front;
    vF.className = 'small' + (front ? ' primary' : '');
    vB.className = 'small' + (!front ? ' primary' : '');
    canvas.requestRenderAll();
  }
  vF.addEventListener('click', () => setView(true));
  vB.addEventListener('click', () => setView(false));

  // ---- Layer ops ----
  function active(){ return canvas.getActiveObject(); }
  document.getElementById('del').addEventListener('click', () => {
    const o = active(); if (o && o.isDesign){ canvas.remove(o); canvas.requestRenderAll(); }
  });
  document.getElementById('dup').addEventListener('click', () => {
    const o = active(); if (!o || !o.isDesign) return;
    o.clone(function(c){ markDesign(c); c.set({ left:(c.left||0)+24, top:(c.top||0)+24 }); canvas.add(c); canvas.setActiveObject(c); canvas.requestRenderAll(); });
  });
  document.getElementById('flip').addEventListener('click', () => {
    const o = active(); if (o && o.isDesign){ o.set('flipX', !o.flipX); canvas.requestRenderAll(); }
  });
  document.getElementById('fwd').addEventListener('click', () => {
    const o = active(); if (o && o.isDesign){ canvas.bringForward(o); canvas.requestRenderAll(); }
  });
  document.getElementById('bwd').addEventListener('click', () => {
    const o = active(); if (o && o.isDesign){ canvas.sendBackwards(o); canvas.requestRenderAll(); }
  });
  document.getElementById('clear').addEventListener('click', () => {
    canvas.getObjects().filter(o => o.isDesign).forEach(o => canvas.remove(o));
    canvas.requestRenderAll();
  });

  // ---- Guide toggle ----
  const tg = document.getElementById('toggleGuide');
  tg.addEventListener('click', () => {
    const v = !guide.visible;
    guide.visible = v; guideLabel.visible = v;
    tg.textContent = v ? '隱藏印刷範圍' : '顯示印刷範圍';
    canvas.requestRenderAll();
  });

  // ---- Download preview ----
  document.getElementById('download').addEventListener('click', () => {
    const gv = guide.visible, lv = guideLabel.visible;
    guide.visible = false; guideLabel.visible = false;
    canvas.requestRenderAll();
    const url = canvas.toDataURL({ format:'png', multiplier: 2 });
    guide.visible = gv; guideLabel.visible = lv;
    canvas.requestRenderAll();
    const a = document.createElement('a');
    a.href = url; a.download = 'tee-design.png';
    document.body.appendChild(a); a.click(); a.remove();
  });

  canvas.requestRenderAll();
})();
</script>
</body>
</html>
